<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Duong0">
    <title>Duong0 App</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #818cf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .btn-install {
            display: block;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            transition: opacity 0.2s;
        }
        .btn-install:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Duong0 App</h2>
        <p>Bấm nút bên dưới để cài đặt ứng dụng này trực tiếp ra màn hình chính iPhone của bạn.</p>
        
        <!-- Nút tải file cấu hình tự động -->
        <a id="downloadProfileBtn" href="#" class="btn-install">
            📲 Cài đặt App ngay
        </a>
    </div>

    <script>
        // Nội dung cấu hình profile iOS chuẩn
        const mobileConfigXML = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>PayloadDisplayName</key>
    <string>Cài đặt App Duong0</string>
    <key>PayloadIdentifier</key>
    <string>com.hoguong45.duong0.profile</string>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadUUID</key>
    <string>A1B2C3D4-E5F6-7890-ABCD-1234567890AB</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
    <key>PayloadOrganization</key>
    <string>Duong0</string>
    <key>PayloadDescription</key>
    <string>Thêm ứng dụng Duong0 ra màn hình chính.</string>
    <key>PayloadContent</key>
    <array>
        <dict>
            <key>PayloadIdentifier</key>
            <string>com.hoguong45.duong0.webclip</string>
            <key>PayloadType</key>
            <string>com.apple.configurator.webclip</string>
            <key>PayloadUUID</key>
            <string>F1E2D3C4-B5A6-0987-FEDC-BA0987654321</string>
            <key>PayloadVersion</key>
            <integer>1</integer>
            <key>PayloadDisplayName</key>
            <string>Duong0</string>
            <key>URL</key>
            <string>https://hoguong45-sketch.github.io/duong0/</string>
            <key>Label</key>
            <string>Duong0</string>
            <key>FullScreen</key>
            <true/>
            <key>IsRemovable</key>
            <true/>
        </dict>
    </array>
</dict>
</plist>`;

        // Tự động đóng gói thành file cấu hình chuẩn khi trang web load xong
        const blob = new Blob([mobileConfigXML], { type: 'application/x-apple-aspen-config' });
        const btn = document.getElementById('downloadProfileBtn');
        btn.href = URL.createObjectURL(blob);
        btn.download = 'duong0.mobileconfig';
    </script>
</body>
</html>
