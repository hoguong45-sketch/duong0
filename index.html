<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankTongocduong</title>
    <!-- Thư viện Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #ffffff;
            --text-secondary: #a0a0ab;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #2a2a32;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .header-brand .logo {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header-brand h2 {
            margin: 0;
            font-size: 20px;
            color: var(--text-color);
        }

        p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #27272a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #3f3f46;
        }

        .form-box {
            display: none;
            text-align: left;
            margin-top: 10px;
        }

        .form-box label {
            font-weight: 500;
            font-size: 13px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
        }

        .form-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background-color: #121214;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-box input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>

    <!-- Menu Chính -->
    <div class="container" id="mainMenu">
        <div class="header-brand">
            <div class="logo">🏦</div>
            <h2>BankTongocduong</h2>
        </div>
        <p>Hệ thống quản lý tài khoản ngân hàng ảo</p>
        
        <button class="btn btn-primary" onclick="showForm('login')">🔑 Đăng Nhập</button>
        <button class="btn btn-secondary" onclick="showForm('register')">📝 Đăng Ký Tài Khoản</button>
    </div>

    <!-- Form Đăng Nhập -->
    <div class="container form-box" id="loginForm">
        <div class="header-brand">
            <div class="logo">🔑</div>
            <h2>Đăng Nhập</h2>
        </div>
        
        <label>Tên đăng nhập hoặc Số điện thoại</label>
        <input type="text" id="loginUser" placeholder="Nhập tài khoản...">
        
        <label>Mật khẩu</label>
        <input type="password" id="loginPass" placeholder="Nhập mật khẩu...">
        
        <button class="btn btn-primary" onclick="handleLogin()">Xác Nhận Đăng Nhập</button>
        <button class="btn btn-secondary" onclick="goBack()">Quay lại Menu</button>
    </div>

    <!-- Form Đăng Ký -->
    <div class="container form-box" id="registerForm">
        <div class="header-brand">
            <div class="logo">📝</div>
            <h2>Đăng Ký Tài Khoản</h2>
        </div>
        
        <label>Họ và Tên</label>
        <input type="text" id="regName" placeholder="Ví dụ: Nguyễn Văn A">
        
        <label>Số điện thoại</label>
        <input type="text" id="regPhone" placeholder="Ví dụ: 0912345678">
        
        <label>Mật khẩu mới</label>
        <input type="password" id="regPass" placeholder="Tạo mật khẩu bảo mật">
        
        <button class="btn btn-primary" onclick="handleRegister()">Hoàn Tất Đăng Ký</button>
        <button class="btn btn-secondary" onclick="goBack()">Quay lại Menu</button>
    </div>

    <script>
        // Khởi tạo Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand();

        function showForm(type) {
            document.getElementById('mainMenu').style.display = 'none';
            if (type === 'login') {
                document.getElementById('loginForm').style.display = 'block';
            } else {
                document.getElementById('registerForm').style.display = 'block';
            }
        }

        function goBack() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
        }

        function handleLogin() {
            alert("Đăng nhập thành công vào BankTongocduong!");
        }

        function handleRegister() {
            alert("Đăng ký tài khoản thành công tại BankTongocduong!");
            goBack();
        }
    </script>
</body>
</html>
